<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="BlynsOS — personal workspace">
  <title>BlynsOS</title>

<link rel="apple-touch-icon" sizes="180x180" href="/v1/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/v1/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/v1/favicon-16x16.png">
<link rel="manifest" href="/v1/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="core.css">
  <link rel="stylesheet" href="../Setup/setup.css">

  <!-- Load order matters: shared systems, independent screens, then Core. -->
  <script defer src="../Systems/storage.js"></script>
  <script defer src="../Systems/security.js"></script>
  <script defer src="../Systems/wallpapers.js"></script>
  <script defer src="../Systems/registry.js"></script>
  <script defer src="../Systems/file-vault.js"></script>
  <script defer src="../Systems/packages.js"></script>
  <script defer src="../Setup/setup.js"></script>
  <script defer src="boot.js"></script>
  <script defer src="off.js"></script>
  <script defer src="core.js"></script>
</head>
<body>
  <section class="ph on" id="power" aria-label="BlynsOS power">
    <p class="power-hint" role="status">Press 0 to power on</p>
  </section>

  <section class="ph" id="boot" aria-label="BlynsOS starting">
    <img alt="BlynsOS" class="boot-logo" src="https://i.postimg.cc/Pxv27fKS/Blyns-OS-Logo.png">
    <div id="bar" aria-label="Startup progress"><i></i></div>
  </section>

  <section class="ph setup-screen" id="setup" aria-label="Initial setup">
    <div class="setup-wallpaper" aria-hidden="true"></div>
    <div class="setup-shade" aria-hidden="true"></div>
    <div id="setup-root"></div>
  </section>

  <section class="ph welcome-screen" id="welcome" aria-label="Welcome">
    <div class="welcome-content">
      <p id="welcome-hello" class="welcome-hello">Hello...</p>
      <p id="welcome-subtitle" class="welcome-subtitle">Your workspace is ready</p>
      <img class="welcome-logo" src="https://i.postimg.cc/Dy8SsWjX/Blyns-OS-Logo.png" alt="BlynsOS">
    </div>
  </section>

  <section class="ph wall" id="lock" aria-label="Lock screen">
    <div id="clock"></div>
    <div id="date"></div>
    <div id="lu">
      <div class="av" id="lav"></div>
      <b id="lnm"></b>
      <input autocomplete="current-password" id="pw" placeholder="Enter password" type="password">
      <p id="unlock-error" role="alert"></p>
    </div>
  </section>

  <section class="ph wall" id="desk" aria-label="Desktop">
    <div class="glass" id="mb">
      <b aria-label="BlynsOS menu" id="ap"></b>
      <b id="an">Files</b>
      <span class="mbmenu" data-menu="File">File</span>
      <span class="mbmenu" data-menu="Window">Window</span>
      <span class="mbmenu" data-menu="Work">Work</span>
      <span class="mbmenu" data-menu="Settings">Blyns</span>
      <div class="r">
        <button aria-label="Spotlight Search" id="spotlightBtn" title="Spotlight Search">
          <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.7"></circle><path d="m16 16 5 5"></path></svg>
        </button>
        <span id="mt"></span>
        <button aria-label="Control Center" id="ccbtn" title="Control Center">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"></path></svg>
        </button>
      </div>
    </div>
    <div id="wins"></div>
    <div class="glass" id="dock"></div>
  </section>

  <div id="hud"><span id="hi">🔊</span><div id="hb"></div></div>
  <div id="siri"><input id="sq" placeholder="Search or Ask"></div>
  <div id="toast" role="status"></div>
  <div id="off" aria-label="Powered off"><div class="power-hint">0 to turn on</div></div>
  <div id="power-transition" aria-hidden="true"></div>
</body>
</html>
