<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="BlynsOS 1.0 Stabilized">
  <title>BlynsOS 1.0 Stabilized</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="core.css">
  <script src="../Systems/storage.js"></script>
  <script src="../Systems/security.js"></script>
  <script src="../Systems/wallpapers.js"></script>
  <script src="../Systems/registry.js"></script>
  <script src="../Systems/packages.js"></script>
  <script src="../Apps/focus-timer.js"></script>
  <script defer src="core.js"></script>
</head>
<body>
  <section class="ph on" id="boot" aria-label="Power on BlynsOS">
    <img alt="BlynsOS" class="boot-logo" src="https://i.postimg.cc/Pxv27fKS/Blyns-OS-Logo.png">
    <div id="bar" aria-label="Startup progress"><i></i></div>
    <p id="hint" role="status">Press 0 to power on</p>
  </section>

  <section class="ph bg" id="setup" aria-label="Setup Assistant">
    <div aria-hidden="true" class="setup-wallpaper"></div>
    <div aria-hidden="true" class="setup-shade"></div>
    <div class="card" id="sc"></div>
  </section>

  <section class="ph wall" id="lock" aria-label="Lock screen">
    <div id="clock"></div>
    <div id="date"></div>
    <div id="lu">
      <div class="av" id="lav"></div>
      <b id="lnm"></b>
      <input autocomplete="current-password" id="pw" placeholder="Enter password" type="password">
      <p id="unlock-error" role="alert"></p>
    </div>
  </section>

  <section class="ph wall" id="desk" aria-label="Desktop">
    <div class="glass" id="mb">
      <b aria-label="BlynsOS menu" id="ap"></b>
      <b id="an">Files</b>
      <span class="mbmenu" data-menu="File">File</span>
      <span class="mbmenu" data-menu="Window">Window</span>
      <span class="mbmenu" data-menu="Work">Work</span>
      <span class="mbmenu" data-menu="Settings">Settings</span>
      <div class="r">
        <button aria-label="Spotlight Search" id="spotlightBtn" title="Spotlight Search (Ctrl + S)">
          <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.7"></circle><path d="m16 16 5 5"></path></svg>
        </button>
        <span id="mt"></span>
        <button aria-label="Control Center" id="ccbtn" title="Control Center (C)">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"></path></svg>
        </button>
      </div>
    </div>
    <div id="wins"></div>
    <div class="glass" id="dock"></div>
  </section>

  <div id="hud"><span id="hi">🔊</span><div id="hb"></div></div>
  <div id="siri"><input id="sq" placeholder="Search or Ask"></div>
  <div id="toast" role="status"></div>
  <div id="off" aria-label="Computer is powered off"></div>
</body>
</html>
