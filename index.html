
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#08090d">
    <meta name="description" content="BlynsOS 1.0 Stabilized">

    <title>BlynsOS</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            background:
                radial-gradient(ellipse at 50% 40%,
                #202536 0%, #10121b 45%, #07080c 100%);
            color: white;
        }

        .container {
            text-align: center;
            animation: appear 1s ease;
        }

        .logo {
            width: 88px;
            height: 88px;
            object-fit: contain;
            margin-bottom: 28px;
            filter: drop-shadow(0 0 28px #8c9eff55);
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 29px;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .version {
            margin-top: 9px;
            font-size: 12px;
            color: #9298a9;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .loading {
            width: 180px;
            height: 3px;
            margin: 38px auto 15px;
            border-radius: 10px;
            background: #ffffff18;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(
                90deg, #8da5ff, #d9e2ff
            );
            box-shadow: 0 0 12px #8da5ff;
            animation: load 2s ease-in-out forwards;
        }

        .status {
            font-size: 11px;
            color: #777e91;
            letter-spacing: 1px;
        }

        @keyframes load {
            to { width: 100%; }
        }

        @keyframes float {
            50% { transform: translateY(-8px); }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <img
            class="logo"
            src="https://i.postimg.cc/Pxv27fKS/Blyns-OS-Logo.png"
            alt="BlynsOS Logo"
        >

        <h1>BlynsOS</h1>
        <div class="version">Version 1.0 Stabilized</div>

        <div class="loading">
            <div class="progress"></div>
        </div>

        <div class="status">Initializing system...</div>
    </div>

    <script>
        setTimeout(() => {
            window.location.replace("Core/Index.html");
        }, 2100);
    </script>

</body>
</html>
